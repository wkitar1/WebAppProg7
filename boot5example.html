<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Starter</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" 
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" 
    integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>  

  </head>
  <body>

<div class="container-fluid">
  <h1>Responsive Columns</h1>
  <p>Resize the browser window to see the effect.</p>
  <p>The columns will automatically stack on top of each other when the screen is less than 576px wide.</p>
  <div class="row">
    <div class="col-6" style="background-color:lavender;">.col-sm-2 this will span 2 columns and is contained inside a div element</div>
    <div class="col" style="background-color:lavenderblush;">.col-sm-3</div>
    <div class="col" style="background-color:lavender;">.col-sm-2</div>
    <div class="col" style="background-color:lavenderblush;">.col-sm-5</div>
  </div>
</div>

<div class="container">
  <button type="button" class="btn btn-success btn-sm">Success in all things is my goal</button>
  <button type="button" class="btn btn-warning  btn-sm">Warning danger ahead</button>
  <button type="button" class="btn btn-danger btn-sm">Danger, can still go back</button>
  <button type="button" class="btn btn-link btn-sm">Link to the secret of life</button>
  </div>

</body>
</html>
