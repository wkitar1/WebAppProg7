<!doctype html>
<html lang="en">
  <head>
    <title>Reflex Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <h1>Wiam Reflexes</h1>
    <h2>Timeout - Red in 3 seconds</h2>
    <div id="target">"Your time"</div>
    <div id="counter">"Count"</div>
    <button type="button" class="btn btn-primary" onclick="beginTime()">
      Go
    </button>
    <button type="button" class="btn btn-primary" onclick="recordTime()">
      Halt
    </button>

    <button type="button" class="btn btn-primary" onclick="buttonPress2()">
      Click me change the color.
    </button>

    <p id="target">I will become red</p>

    <script>
      let haltTime = undefined;
      function recordTime() {
        haltTime = Date.now();
        console.log(haltTime);
      }
      function beginTime() {
        for (let i = 0; i < 6; i++) {
          setTimeout(
            function () {
              document.getElementById("counter").innerHTML = i;
            },
            (5 - i) * 1000,
          );
        }
        setTimeout(function () {
          if (haltTime == undefined) {
            document.getElementById("target").innerHTML = "Not soon enough";
          } else {
            let targetTime = Date.now();
            let elapsedTime = targetTime - haltTime;
            document.getElementById("target").innerHTML =
              "Time was " + elapsedTime;
          }
        }, 5000);
      }

      function buttonPress1() {
        setTimeout(function () {
          document.getElementById("target").style.color = "red";
        }, 3000);
      }

      function buttonPress2() {
        setTimeout(() => {
          document.getElementById("target").style.color = "red";
        }, 3000);
      }
    </script>
  </body>
</html>
