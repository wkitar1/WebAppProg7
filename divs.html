<!doctype html>
<html>
  <head>
    <style>
      .flex-container {
        display: flex;
        flex-direction: row;
        background-color: red;
      }

      .flex-container > div {
        /*div children of the flex container*/
        background-color: #f1f1f1;
        margin: 10px;
        padding: 20px;
        font-size: 30px;
      }

      /* Responsive layout */
      @media (max-width: 600px) {
        .flex-container {
          flex-direction: column;
          background-color: green;
        }
      }
    </style>
    <title>Divs</title>
  </head>
  <h1>Wiam builds list with divs</h1>

  <body>
    <input type="text" id="input1" name="input1" />
    <div class="flex-container" id="target">
      <div class="divlist">row item 1</div>
      <div class="divlist">row item 2</div>
      <div class="divlist">row item 3</div>
    </div>

    <p>
      Press the button to create an new element of type div and then add it to
      the container.
    </p>
    <button onclick="makeNewDiv()">Add end</button>
    <button onclick="addFront()">Add front</button>
    <button onclick="removeEveryOther()">Remove</button>
    <button onclick="shuffle()">shuffle</button>
  </body>
  <script>
    function makeNewDiv() {
      /* make the div and its text */
      let element = document.createElement("div");
      let value = document.getElementById("input1").value;
      element.innerHTML = value;
      element.className = "divlist";
      element.style.color = "orange";

      /* add it to the container */
      let container = document.getElementById("target");
      container.appendChild(element);
    }
    function removeEveryOther() {
      let divListItems = document.getElementsByClassName("divlist");
      let len = divListItems.length;
      if (len > 0) {
        for (let i = len - 1; i >= 0; i--) {
          if (i % 2 == 0) {
            divListItems[i].remove();
          }
        }
      }
    }
    function addFront() {
      let element = document.createElement("div");
      let value = document.getElementById("input1").value;
      element.innerHTML = value;
      element.className = "divlist";
      let container = document.getElementById("target");
      container.insertBefore(element, container.firstChild);
    }
    function shuffle() {
      let items = document.getElementsByClassName("divlist");
      let a = items[Math.floor(Math.random() * items.length)];
      let b = items[Math.floor(Math.random() * items.length)];
      let temp = a.innerHTML;
      a.innerHTML = b.innerHTML;
      b.innerHTML = temp;
    }
  </script>
</html>
